<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VulnScan | Security Scanner</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body><main class="container">
  <header><p class="eyebrow">CYBERSECURITY • EDUCATIONAL TOOL</p><h1>VulnScan</h1>
  <p>Check an authorized host for open TCP ports and basic web security indicators.</p></header>
  <section class="panel">
    <form id="scan-form">
      <label for="target">Target hostname or IP</label><input id="target" name="target" placeholder="127.0.0.1" required>
      <label for="ports">Ports (optional)</label><input id="ports" name="ports" placeholder="22,80,443 or 1-1024">
      <label class="check"><input type="checkbox" id="consent" required> I own this system or have permission to scan it.</label>
      <button type="submit">Start scan</button>
    </form>
    <p id="status" role="status"></p>
    <pre id="output" class="output" hidden></pre>
    <a id="report-link" href="/report" hidden>Open formatted report</a>
  </section>
  <p class="foot">Use only on systems you own or are explicitly authorized to test. Findings require manual verification.</p>
</main>
<script>
const form = document.querySelector("#scan-form");
form.addEventListener("submit", async (event) => {
  event.preventDefault();
  const status = document.querySelector("#status");
  const output = document.querySelector("#output");
  status.textContent = "Scanning…"; output.hidden = true;
  try {
    const response = await fetch("/api/scan", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        target: document.querySelector("#target").value,
        ports: document.querySelector("#ports").value || null,
        consent: document.querySelector("#consent").checked,
        options: {versions: true, web: true, tls: true}
      })
    });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || "Scan failed");
    output.textContent = JSON.stringify(data, null, 2);
    output.hidden = false;
    document.querySelector("#report-link").hidden = false;
    status.textContent = "Scan completed. Review the results below.";
  } catch (error) { status.textContent = error.message; }
});
</script></body></html>
